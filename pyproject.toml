[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kasi-logistics"
version = "0.1.0"
description = "Informal Retail Mesh & Route Optimization Agent powered by Meta AI models and PayMerch Mobile"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []